<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>steer-ui · page notes</title>
    <link rel="stylesheet" href="/src/demo.css" />
  </head>
  <body>
    <div class="bar">
      <div class="bar-l">
        <span class="tag">layered v2</span>
        <button id="add" class="btn">Add note&nbsp; (c)</button>
        <button id="shuffle" class="btn ghost">Shuffle the app</button>
        <button id="reset" class="btn ghost">Reset</button>
        <label class="tog"><input type="checkbox" id="showtext" checked /> show text</label>
      </div>
      <div class="bar-r">
        <span id="stat" class="stat"></span>
        <span id="dims" class="dims"></span>
        <a class="link" href="/matrix.html">matrix →</a>
      </div>
    </div>

    <p class="hint">
      Drag the window edge with your mouse. The dashboard reflows and the notes stay on the
      thing they were about. <b>Shuffle</b> changes the data, the layout and the source line
      numbers underneath them at once.
    </p>

    <div id="app" class="app"></div>
    <ol id="rail" class="rail"></ol>
    <div id="layer" class="layer"></div>

    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
