<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian · Revenue</title>
    <link rel="stylesheet" href="/src/demo.css" />
  </head>
  <body>
    <div id="frame" class="frame">
      <div id="app" class="app"></div>
    </div>
    <div id="layer" class="layer"></div>

    <div id="peek" class="peek" data-expanded>
      <div class="glass peek-cluster">
        <button id="peek-dot" class="peek-dot" type="button" title="Collapse" data-steer-peek>
          <i></i><span id="peek-count">0</span>
        </button>
        <div class="peek-rest">
          <span class="peek-rule" aria-hidden="true"></span>
          <button id="peek-add" class="peek-add" type="button" data-steer-note-toggle>
            <span class="peek-add-label">
              <span class="peek-add-sizer" aria-hidden="true">Add note</span>
              <span id="peek-add-text">Add note</span>
            </span>
            <kbd id="peek-add-key">C</kbd>
          </button>
          <span class="peek-rule" aria-hidden="true"></span>
          <button
            id="peek-eye"
            class="peek-icon"
            type="button"
            title="Hide pins"
            aria-pressed="true"
            aria-label="Hide pins"
          >
            <svg class="eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-off" hidden viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3l18 18" />
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
              <path d="M9.4 5.5A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.3" />
              <path d="M6.7 6.7C3.8 8.6 2 12 2 12s3.5 7 10 7a10.4 10.4 0 0 0 4.2-.9" />
            </svg>
          </button>
          <span class="peek-rule" aria-hidden="true"></span>
          <div class="peek-band" aria-live="polite">
            <span id="peek-width">—</span>
            <span id="peek-split">—</span>
          </div>
          <span class="peek-rule" aria-hidden="true"></span>
          <a
            id="peek-bench"
            class="peek-icon"
            href="http://localhost:5199/__steer"
            title="Open in bench"
            target="_blank"
            rel="noreferrer"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7" />
              <path d="M8 7h9v9" />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
